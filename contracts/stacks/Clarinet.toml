[project]
name = "blindcore-stacks-anchor"
description = "BlindCore Stacks L2 state-root anchor and secp256k1 receipt settlement verifier"
authors = ["Blind Labs"]
telemetry = false
cache_dir = "./.clarinet"

[contracts.blindcore-root-anchor]
path = "blindcore-root-anchor.clar"
clarity_version = 2
epoch = 2.5

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = true
trusted_sender = false
trusted_caller = false
callee_filter = false
